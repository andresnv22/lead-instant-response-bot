[project]
name = "lead-instant-response-bot"
version = "1.0.0"
description = "Webhook instant-response lead qualifier with SQLite idempotency, thread-safe Excel export, and SMTP reply"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic[email]>=2.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
